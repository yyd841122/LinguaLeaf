name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Skip-workspace-prepare ordering: import-core's tsc needs
      # reading-model's dist types, and npm ci races the two prepares
      # (first CI run failed exactly there). Build them in order.
      - run: npm rebuild better-sqlite3
      - run: npm run build --workspace @lingualeaf/reading-model && npm run build --workspace @lingualeaf/import-core
      - run: npm run verify
